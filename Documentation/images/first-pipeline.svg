<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">Your first MOSAIC pipeline</title>
  <desc id="desc">A 200 Hz Clock feeds a sine generator. Its output branches into a square function and a multiply-by-two function.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#00b0f4"/></marker></defs>
  <rect width="800" height="410" rx="18" fill="#1f1f23"/>
  <g fill="#292b30" stroke="#59616d" stroke-width="1.5">
    <rect x="250" y="24" width="300" height="78" rx="12"/>
    <rect x="250" y="150" width="300" height="78" rx="12"/>
    <rect x="45" y="300" width="310" height="78" rx="12"/>
    <rect x="445" y="300" width="310" height="78" rx="12"/>
  </g>
  <g fill="none" stroke="#00b0f4" stroke-width="3" marker-end="url(#arrow)">
    <path d="M400 102 V145"/><path d="M400 228 V264 H200 V294"/><path d="M400 264 H600 V294"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#e1e1e1">
    <g font-size="23" font-weight="600"><text x="400" y="58">Clock</text><text x="400" y="184">Sine generator</text><text x="200" y="334">Square</text><text x="600" y="334">Double</text></g>
    <g font-size="17" fill="#b9c4d2"><text x="400" y="84">200 ticks per second</text><text x="400" y="210">One vector per tick</text><text x="200" y="360">Function · power, 2</text><text x="600" y="360">Function · multiply, 2</text></g>
  </g>
</svg>
