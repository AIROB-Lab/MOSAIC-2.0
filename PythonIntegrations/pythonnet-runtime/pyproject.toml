[tool.poetry]
name = "mosaic-pythonnet-runtime"
version = "0.1.0"
description = "Python dependencies for the public MOSAIC UMAP and pythonnet integrations"
authors = ["MOSAIC contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
scikit-learn = "^1.5.2"
numpy = "^2.1.3"
scipy = "^1.14.1"
tdigest = "^0.5.2.2"
matplotlib = "^3.10.6"
umap-learn = "^0.5.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
